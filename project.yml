name: Framewright

options:
  bundleIdPrefix: com.justjohn12345
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Debug and Release are ad hoc signed (headless, no account); Distribution is Release plus a real
# identity and the hardened runtime (see Config/Distribution.xcconfig).
configs:
  Debug: debug
  Release: release
  Distribution: release

configFiles:
  Distribution: Config/Distribution.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.1.10
    CURRENT_PROJECT_VERSION: 11
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    # FFmpeg is found through the system-header path so its headers don't add
    # warnings to our build; our own code keeps the full warning set.
    FFMPEG_ROOT: $(SRCROOT)/ThirdParty/ffmpeg
    SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/ThirdParty $(FFMPEG_ROOT)/include
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_WARN_SHADOW: YES
    CLANG_WARN_IMPLICIT_SIGN_CONVERSION: NO
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    # The build is warning-free and must stay so.
    WARNING_CFLAGS: $(inherited) -Wall -Wextra
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    # Ad hoc signing without the hardened runtime, so xcodebuild builds, tests and launches
    # headless without a developer account (library validation would reject ad hoc libraries).
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    # A real identity and team (Config/Distribution.xcconfig) and the hardened runtime: what
    # notarized distribution requires.
    Distribution:
      CODE_SIGN_IDENTITY: $(FRAMEWRIGHT_CODE_SIGN_IDENTITY)
      DEVELOPMENT_TEAM: $(FRAMEWRIGHT_DEVELOPMENT_TEAM)
      ENABLE_HARDENED_RUNTIME: YES
      # Notarization needs a secure timestamp on every signature (xcodebuild build, unlike
      # archive, does not add it) and refuses the get-task-allow entitlement Xcode injects
      # into non-archive builds for debugging.
      OTHER_CODE_SIGN_FLAGS: --timestamp
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  FramewrightEngine:
    type: framework
    platform: macOS
    sources:
      - path: Engine
        excludes:
          - "Facade/**"
          - "**/.gitkeep"
        headerVisibility: project
      - path: Engine/Facade
        headerVisibility: public
        # Obj-C++ helpers of the facade implementation; included by path, never public.
        excludes:
          - "**/*+Internal.h"
      # Stage the FFmpeg dylibs next to the framework in the build products
      # directory so the framework's @loader_path/../../.. rpath resolves them when
      # running from DerivedData (EngineTests). The directory must exist when
      # `xcodegen generate` runs, i.e. run Scripts/build-ffmpeg.sh first.
      - path: ThirdParty/ffmpeg/lib
        includes:
          - "lib*.*.dylib"
        buildPhase:
          copyFiles:
            destination: productsDirectory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright.engine
        PRODUCT_NAME: FramewrightEngine
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        VERSIONING_SYSTEM: apple-generic
        LIBRARY_SEARCH_PATHS: $(inherited) $(FFMPEG_ROOT)/lib
        OTHER_LDFLAGS: $(inherited) -lavformat -lavcodec -lswscale -lswresample -lavutil
        # @loader_path is FramewrightEngine.framework/Versions/A, so ../../.. is the directory
        # that contains the framework: Contents/Frameworks inside Framewright.app, or the
        # build products directory in DerivedData. The FFmpeg dylibs are placed next to
        # the framework in both (see the copy-files phases for ThirdParty/ffmpeg/lib in
        # this target and in Framewright).
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @loader_path/Frameworks @loader_path/../../..
        MTL_LANGUAGE_REVISION: Metal30
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    configs:
      Release:
        MTL_ENABLE_DEBUG_INFO: NO
      Distribution:
        MTL_ENABLE_DEBUG_INFO: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: Accelerate.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreImage.framework
      - sdk: IOSurface.framework
      - sdk: ImageIO.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AppKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOKit.framework

  EngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EngineTests
        excludes:
          - "**/.gitkeep"
          # The version 8 migration goldens share their names with the version 7 ones beside them;
          # the tests read every golden from the source tree (__FILE__), so they need no bundle copy.
          - "Serialize/golden/v8/**"
          # Likewise the version 9 goldens.
          - "Serialize/golden/v9/**"
    dependencies:
      - target: FramewrightEngine
      - sdk: Metal.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: AppKit.framework
      - sdk: CoreGraphics.framework
      - sdk: IOKit.framework
      # The playback latency test asks CoreAudio what the default output device is (Bluetooth?).
      - sdk: CoreAudio.framework
      # The paused seek tests read a file's sample table (timing and sync flags) without decoding.
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright.EngineTests
        GENERATE_INFOPLIST_FILE: YES
        # EngineTests.xctest/Contents/MacOS/../../.. is the build products directory.
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks @loader_path/../../..

  Framewright:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.gitkeep"
          - "Resources/Acknowledgements.md"
          - "Resources/COPYING.LGPLv2.1"
      # Third-party notices and the LGPL text, shown by Framewright > Acknowledgements.
      - path: App/Resources/Acknowledgements.md
        buildPhase: resources
      - path: App/Resources/COPYING.LGPLv2.1
        buildPhase: resources
      # Embed the FFmpeg dylibs in Framewright.app/Contents/Frameworks and sign them on
      # copy (LGPL: the libraries stay dynamically linked and replaceable).
      - path: ThirdParty/ffmpeg/lib
        includes:
          - "lib*.*.dylib"
        attributes:
          - CodeSignOnCopy
        buildPhase:
          copyFiles:
            destination: frameworks
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Framewright
        CFBundleName: Framewright
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Framewright Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.justjohn12345.framewright.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.justjohn12345.framewright.project
            UTTypeDescription: Framewright Project
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - framewright
              public.mime-type:
                - application/x-framewright+json
          # In-app drag payload: a reference to an asset of the open project (media bin -> timeline).
          - UTTypeIdentifier: com.justjohn12345.framewright.asset-reference
            UTTypeDescription: Framewright Media Reference
            UTTypeConformsTo:
              - public.data
          # In-app drag payloads of the Transitions panel (one type per kind, so the timeline
          # knows what is dragged before the drop).
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.cross-dissolve
            UTTypeDescription: Framewright Cross Dissolve
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.wipe-left
            UTTypeDescription: Framewright Wipe Left
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.wipe-right
            UTTypeDescription: Framewright Wipe Right
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.wipe-up
            UTTypeDescription: Framewright Wipe Up
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.wipe-down
            UTTypeDescription: Framewright Wipe Down
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.iris
            UTTypeDescription: Framewright Iris
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.audio-crossfade
            UTTypeDescription: Framewright Audio Crossfade
            UTTypeConformsTo:
              - public.data
          # In-app drag payloads of the Effects tab's lane effects (a Fade on video, a Gain span on audio).
          - UTTypeIdentifier: com.justjohn12345.framewright.effect.fade
            UTTypeDescription: Framewright Fade Effect
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.effect.gain
            UTTypeDescription: Framewright Gain Effect
            UTTypeConformsTo:
              - public.data
          # ... and its Motion spans with an intent (Ken Burns, Move).
          - UTTypeIdentifier: com.justjohn12345.framewright.effect.ken-burns
            UTTypeDescription: Framewright Ken Burns Effect
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.effect.move
            UTTypeDescription: Framewright Move Effect
            UTTypeConformsTo:
              - public.data
        # No imported declarations: the app makes the file promise types and the Live Photo bundle
        # type with UTType(importedAs:) (App/State/PromisedFiles.swift), which works whether or not
        # the system declares them (com.apple.NSFilePromiseItemMetaData is a pasteboard type, not a
        # system UTI). PhotosDropTests checks the drop targets accept each one.
    entitlements:
      path: App/Resources/Framewright.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    dependencies:
      - target: FramewrightEngine
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright
        PRODUCT_NAME: Framewright
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES

  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Framewright
      - target: FramewrightEngine
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright.AppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Framewright.app/Contents/MacOS/Framewright
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Framewright:
    build:
      targets:
        Framewright: all
        FramewrightEngine: all
        EngineTests: [test]
        AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Framewright
        - FramewrightEngine
      # The opt-in stress tests run in the StressTests scheme only.
      targets:
        - name: EngineTests
          skippedTests:
            - HourExportStressTests
            - PausedSeekSoakTests
            # Run only in a fresh process by HardwareCapsTests' own test (review B9).
            - HardwareCapsTests/testChildFirstVideoToolboxUseRegistersVP9
        - name: AppTests
          skippedTests: [TwoHourProjectStressTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Distribution

  EngineTests:
    build:
      targets:
        FramewrightEngine: all
        EngineTests: [test]
    test:
      config: Debug
      targets:
        - name: EngineTests
          skippedTests:
            - HourExportStressTests
            - PausedSeekSoakTests
            # Run only in a fresh process by HardwareCapsTests' own test (review B9).
            - HardwareCapsTests/testChildFirstVideoToolboxUseRegistersVP9

  AppTests:
    build:
      targets:
        Framewright: all
        AppTests: [test]
    test:
      config: Debug
      targets:
        - name: AppTests
          skippedTests: [TwoHourProjectStressTests]

  # Long-running stress tests (about twelve minutes; see README "Stress tests"): a one-hour 29.97 fps
  # export checked frame and sample exact (EngineTests/Stress), the paused-seek soak (200 random
  # clicks in real time, and the user's demo project where it is present: PausedSeekSoakTests) and
  # a two-hour, 400-clip project's memory and responsiveness through the facade and the app's
  # timeline (AppTests). Only these
  # tests run here; FRAMEWRIGHT_STRESS=1 lets them run (they skip without it). No coverage, so the
  # timings are those of the ordinary Debug build.
  StressTests:
    build:
      targets:
        Framewright: all
        FramewrightEngine: all
        EngineTests: [test]
        AppTests: [test]
    test:
      config: Debug
      environmentVariables:
        FRAMEWRIGHT_STRESS: "1"
      targets:
        - name: EngineTests
          selectedTests: [HourExportStressTests, PausedSeekSoakTests]
        - name: AppTests
          selectedTests: [TwoHourProjectStressTests]
