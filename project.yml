name: Framewright

options:
  bundleIdPrefix: com.justjohn12345
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# Debug and Release are ad hoc signed (headless, no account); Distribution is Release plus a real
# identity and the hardened runtime (see Config/Distribution.xcconfig).
configs:
  Debug: debug
  Release: release
  Distribution: release

configFiles:
  Distribution: Config/Distribution.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    # FFmpeg is found through the system-header path so its headers don't add
    # warnings to our build; our own code keeps the full warning set.
    FFMPEG_ROOT: $(SRCROOT)/ThirdParty/ffmpeg
    SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/ThirdParty $(FFMPEG_ROOT)/include
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_WARN_SHADOW: YES
    CLANG_WARN_IMPLICIT_SIGN_CONVERSION: NO
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    # The build is warning-free and must stay so.
    WARNING_CFLAGS: $(inherited) -Wall -Wextra
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    # Ad hoc signing without the hardened runtime, so xcodebuild builds, tests and launches
    # headless without a developer account (library validation would reject ad hoc libraries).
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    # A real identity and team (Config/Distribution.xcconfig) and the hardened runtime: what
    # notarized distribution requires.
    Distribution:
      CODE_SIGN_IDENTITY: $(FRAMEWRIGHT_CODE_SIGN_IDENTITY)
      DEVELOPMENT_TEAM: $(FRAMEWRIGHT_DEVELOPMENT_TEAM)
      ENABLE_HARDENED_RUNTIME: YES

targets:
  FramewrightEngine:
    type: framework
    platform: macOS
    sources:
      - path: Engine
        excludes:
          - "Facade/**"
          - "**/.gitkeep"
        headerVisibility: project
      - path: Engine/Facade
        headerVisibility: public
        # Obj-C++ helpers of the facade implementation; included by path, never public.
        excludes:
          - "**/*+Internal.h"
      # Stage the FFmpeg dylibs next to the framework in the build products
      # directory so the framework's @loader_path/../../.. rpath resolves them when
      # running from DerivedData (EngineTests). The directory must exist when
      # `xcodegen generate` runs, i.e. run Scripts/build-ffmpeg.sh first.
      - path: ThirdParty/ffmpeg/lib
        includes:
          - "lib*.*.dylib"
        buildPhase:
          copyFiles:
            destination: productsDirectory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright.engine
        PRODUCT_NAME: FramewrightEngine
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        VERSIONING_SYSTEM: apple-generic
        LIBRARY_SEARCH_PATHS: $(inherited) $(FFMPEG_ROOT)/lib
        OTHER_LDFLAGS: $(inherited) -lavformat -lavcodec -lswscale -lswresample -lavutil
        # @loader_path is FramewrightEngine.framework/Versions/A, so ../../.. is the directory
        # that contains the framework: Contents/Frameworks inside Framewright.app, or the
        # build products directory in DerivedData. The FFmpeg dylibs are placed next to
        # the framework in both (see the copy-files phases for ThirdParty/ffmpeg/lib in
        # this target and in Framewright).
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @loader_path/Frameworks @loader_path/../../..
        MTL_LANGUAGE_REVISION: Metal30
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    configs:
      Release:
        MTL_ENABLE_DEBUG_INFO: NO
      Distribution:
        MTL_ENABLE_DEBUG_INFO: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: Accelerate.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreImage.framework
      - sdk: IOSurface.framework
      - sdk: ImageIO.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AppKit.framework
      - sdk: QuartzCore.framework

  EngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EngineTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: FramewrightEngine
      - sdk: Metal.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: AppKit.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright.EngineTests
        GENERATE_INFOPLIST_FILE: YES
        # EngineTests.xctest/Contents/MacOS/../../.. is the build products directory.
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks @loader_path/../../..

  Framewright:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.gitkeep"
          - "Resources/Acknowledgements.md"
          - "Resources/COPYING.LGPLv2.1"
      # Third-party notices and the LGPL text, shown by Framewright > Acknowledgements.
      - path: App/Resources/Acknowledgements.md
        buildPhase: resources
      - path: App/Resources/COPYING.LGPLv2.1
        buildPhase: resources
      # Embed the FFmpeg dylibs in Framewright.app/Contents/Frameworks and sign them on
      # copy (LGPL: the libraries stay dynamically linked and replaceable).
      - path: ThirdParty/ffmpeg/lib
        includes:
          - "lib*.*.dylib"
        attributes:
          - CodeSignOnCopy
        buildPhase:
          copyFiles:
            destination: frameworks
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Framewright
        CFBundleName: Framewright
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Framewright Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.justjohn12345.framewright.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.justjohn12345.framewright.project
            UTTypeDescription: Framewright Project
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - framewright
              public.mime-type:
                - application/x-framewright+json
          # In-app drag payload: a reference to an asset of the open project (media bin -> timeline).
          - UTTypeIdentifier: com.justjohn12345.framewright.asset-reference
            UTTypeDescription: Framewright Media Reference
            UTTypeConformsTo:
              - public.data
          # In-app drag payloads of the Transitions panel (one type per kind, so the timeline
          # knows what is dragged before the drop).
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.cross-dissolve
            UTTypeDescription: Framewright Cross Dissolve
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.justjohn12345.framewright.transition.audio-crossfade
            UTTypeDescription: Framewright Audio Crossfade
            UTTypeConformsTo:
              - public.data
    entitlements:
      path: App/Resources/Framewright.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    dependencies:
      - target: FramewrightEngine
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright
        PRODUCT_NAME: Framewright
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES

  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Framewright
      - target: FramewrightEngine
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justjohn12345.framewright.AppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Framewright.app/Contents/MacOS/Framewright
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Framewright:
    build:
      targets:
        Framewright: all
        FramewrightEngine: all
        EngineTests: [test]
        AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Framewright
        - FramewrightEngine
      targets:
        - EngineTests
        - AppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Distribution

  EngineTests:
    build:
      targets:
        FramewrightEngine: all
        EngineTests: [test]
    test:
      config: Debug
      targets:
        - EngineTests

  AppTests:
    build:
      targets:
        Framewright: all
        AppTests: [test]
    test:
      config: Debug
      targets:
        - AppTests
